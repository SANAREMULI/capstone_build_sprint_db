<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><style>text{font:14px Arial;fill:#17202a}.title{font:bold 20px Arial}.head{font:bold 15px Arial;fill:#fff}.box{fill:#f7fbff;stroke:#2364aa;stroke-width:2}.bar{fill:#2364aa}.line{stroke:#4b5563;stroke-width:2;fill:none}.key{font:bold 14px Arial;fill:#9a3412}</style><text x="30" y="35" class="title">ShopSphere ER Diagram | PK = key, FK = foreign key</text><path class="line" d="M210 150H310M500 150H590M780 150H900M400 315V235M690 315V235M1000 315V235M210 520H310M500 520H590M780 520H900"/><g transform="translate(30 70)"><rect class="box" width="180" height="165"/><rect class="bar" width="180" height="32"/><text x="12" y="22" class="head">TENANTS</text><text x="12" y="57" class="key">PK tenant_id uuid</text><text x="12" y="82">name varchar</text><text x="12" y="107">created_at timestamptz</text></g><g transform="translate(310 70)"><rect class="box" width="190" height="165"/><rect class="bar" width="190" height="32"/><text x="12" y="22" class="head">CUSTOMERS</text><text x="12" y="57" class="key">PK customer_id</text><text x="12" y="82" class="key">FK tenant_id</text><text x="12" y="107">email citext</text><text x="12" y="132">full_name varchar</text></g><g transform="translate(590 70)"><rect class="box" width="190" height="165"/><rect class="bar" width="190" height="32"/><text x="12" y="22" class="head">PRODUCTS</text><text x="12" y="57" class="key">PK product_id</text><text x="12" y="82" class="key">FK tenant_id</text><text x="12" y="107">sku, name</text><text x="12" y="132">price, status</text></g><g transform="translate(900 70)"><rect class="box" width="220" height="165"/><rect class="bar" width="220" height="32"/><text x="12" y="22" class="head">INVENTORY</text><text x="12" y="57" class="key">PK/FK product_id</text><text x="12" y="82" class="key">FK tenant_id</text><text x="12" y="107">quantity_on_hand</text><text x="12" y="132">reorder_level</text></g><g transform="translate(310 315)"><rect class="box" width="190" height="165"/><rect class="bar" width="190" height="32"/><text x="12" y="22" class="head">ORDERS</text><text x="12" y="57" class="key">PK order_id</text><text x="12" y="82" class="key">FK tenant_id, customer_id</text><text x="12" y="107">status</text><text x="12" y="132">total_amount, created_at</text></g><g transform="translate(590 315)"><rect class="box" width="190" height="165"/><rect class="bar" width="190" height="32"/><text x="12" y="22" class="head">ORDER_ITEMS</text><text x="12" y="57" class="key">PK order_item_id</text><text x="12" y="82" class="key">FK order_id, product_id</text><text x="12" y="107">quantity</text><text x="12" y="132">unit_price</text></g><g transform="translate(900 315)"><rect class="box" width="220" height="165"/><rect class="bar" width="220" height="32"/><text x="12" y="22" class="head">PAYMENTS</text><text x="12" y="57" class="key">PK payment_id</text><text x="12" y="82" class="key">FK tenant_id, order_id</text><text x="12" y="107">provider_reference</text><text x="12" y="132">status, amount</text></g><g transform="translate(310 520)"><rect class="box" width="190" height="165"/><rect class="bar" width="190" height="32"/><text x="12" y="22" class="head">SHIPMENTS</text><text x="12" y="57" class="key">PK shipment_id</text><text x="12" y="82" class="key">FK tenant_id, order_id</text><text x="12" y="107">status</text><text x="12" y="132">tracking_number</text></g><g transform="translate(590 520)"><rect class="box" width="190" height="165"/><rect class="bar" width="190" height="32"/><text x="12" y="22" class="head">AUDIT_LOG</text><text x="12" y="57" class="key">PK audit_id</text><text x="12" y="82">tenant_id</text><text x="12" y="107">table_name, action</text><text x="12" y="132">old_row, new_row</text></g><text x="42" y="255">1</text><text x="286" y="255">many</text><text x="530" y="255">many</text><text x="850" y="255">1</text></svg>